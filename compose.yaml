x-api: &api
  image: detective-api:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &api-environment
    APP_ENV: production
    DATABASE_URL_FILE: /run/secrets/database_url
    TOKEN_HASH_PEPPER_FILE: /run/secrets/token_hash_pepper
    ALLOWED_ORIGINS: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
    SESSION_COOKIE_SECURE: "true"
    CASE_STORAGE_PATH: /data/cases
    DATABASE_SCHEMA: public
    FORWARDED_ALLOW_IPS: ${PROXY_IP:-172.30.0.2}
  secrets:
    - database_url
    - token_hash_pepper
  volumes:
    - cases:/data/cases
  networks:
    - application
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  pids_limit: 128
  mem_limit: 1g
  cpus: 1.5
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-detective}
      POSTGRES_USER: ${POSTGRES_USER:-detective}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/18/docker
    secrets:
      - postgres_password
    volumes:
      - database:/var/lib/postgresql
    networks:
      - application
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  cases-init:
    <<: *api
    profiles: [operations]
    user: "0:0"
    entrypoint: [python, -c]
    command: ['import os; os.chown("/data/cases",10001,10001); os.chmod("/data/cases",0o700)']
    cap_drop: []
    cap_add: [CHOWN, FOWNER]

  migrate:
    <<: *api
    profiles: [operations]
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import os,urllib.request; from urllib.parse import urlsplit; h=urlsplit(os.environ["ALLOWED_ORIGINS"].split(",")[0]).netloc; r=urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/health/ready",headers={"Host":h}),timeout=4); assert r.status==200']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 45s

  proxy:
    image: detective-proxy:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - ${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80
      - ${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      application:
        ipv4_address: ${PROXY_IP:-172.30.0.2}
      edge: {}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/health/live]
      interval: 10s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  application:
    internal: true
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.30.0.0/24}
          ip_range: ${NETWORK_DYNAMIC_RANGE:-172.30.0.128/25}
  edge: {}

volumes:
  database: {}
  cases: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  database_url:
    file: ${SECRETS_DIR:?Set SECRETS_DIR}/database_url
  token_hash_pepper:
    file: ${SECRETS_DIR:?Set SECRETS_DIR}/token_hash_pepper
  postgres_password:
    file: ${SECRETS_DIR:?Set SECRETS_DIR}/postgres_password
