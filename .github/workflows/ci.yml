name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: detective_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: detective_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U detective_test -d detective_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://detective_test:disposable-ci-only@127.0.0.1:5432/detective_test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check backend tests infra
      - run: ruff format --check backend tests infra
      - run: mypy backend
      - name: Locate headless Chrome
        run: |
          detective_chrome_binary="$(command -v google-chrome)"
          echo "DETECTIVE_CHROME_BIN=$detective_chrome_binary" >> "$GITHUB_ENV"
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DETECTIVE_DOCKER_TESTS: "1"
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-dev.lock
      - name: Locate headless Chrome
        run: |
          detective_chrome_binary="$(command -v google-chrome)"
          echo "DETECTIVE_CHROME_BIN=$detective_chrome_binary" >> "$GITHUB_ENV"
      - name: Verify Docker Compose
        run: docker compose version
      - name: Isolated HTTPS game and backup restore
        run: pytest -q tests/production --tb=short
